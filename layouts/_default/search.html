{{ define "main" }}
<header class="section-head">
  <h1>{{ .Title }}</h1>
  <p class="section-intro">{{ i18n "searchHint" }}</p>
</header>

<div class="search-box">
  <input id="search-input" type="search" autocomplete="off" autofocus
         placeholder="{{ i18n "searchPlaceholder" }}"
         data-index="{{ "index.json" | relLangURL }}"
         data-empty="{{ i18n "searchEmpty" }}">
</div>

<div id="search-results" class="card-list" aria-live="polite"></div>
<p id="search-empty" class="empty" hidden>{{ i18n "searchEmpty" }}</p>

<script>
(function () {
  var input = document.getElementById('search-input');
  var list = document.getElementById('search-results');
  var empty = document.getElementById('search-empty');
  var items = null;

  function esc(s) {
    return String(s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(q) {
    if (!items) return;
    var needle = q.trim().toLowerCase();
    list.innerHTML = '';
    if (!needle) { empty.hidden = true; return; }
    var hits = items.filter(function (it) {
      return (it.title + ' ' + it.summary + ' ' + (it.tags || []).join(' ') + ' ' + it.text)
        .toLowerCase().indexOf(needle) >= 0;
    }).slice(0, 20);
    empty.hidden = hits.length > 0;
    hits.forEach(function (it) {
      var a = document.createElement('a');
      a.className = 'stack-card';
      a.href = it.url;
      a.innerHTML = '<div class="card-inner"><div>' +
        '<h3 class="card-title"><span>' + esc(it.title) + '</span></h3>' +
        '<p class="card-excerpt">' + esc(it.summary) + '</p>' +
        '<p class="card-meta"><span>' + esc(it.date) + '</span><span class="dot">·</span>' +
        '<span>' + esc(it.section) + '</span></p></div></div>';
      list.appendChild(a);
    });
  }

  fetch(input.dataset.index).then(function (r) { return r.json(); }).then(function (data) {
    items = data;
    render(input.value);
  }).catch(function () { /* 索引没生成时静默失败，页面仍可用 */ });

  input.addEventListener('input', function () { render(input.value); });
})();
</script>
{{ end }}
