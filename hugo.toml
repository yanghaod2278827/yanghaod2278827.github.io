# ── 站内搜索索引（每语言一份 /index.json）────────────────────
[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

# ── 数学公式：让 $…$ / $$…$$ / \(…\) 原样进 HTML，交给 KaTeX 渲染 ──
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

