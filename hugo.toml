baseURL = "https://yanghaod2278827.github.io/"
defaultContentLanguage = "zh"
# 中文放根路径（/posts/...），英文放 /en/posts/...，已有的中文链接不会失效
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# 文章 URL：/posts/2026/10/30/slug/
[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # 允许正文里写 HTML（README 风格的表格/图能直接粘）
  [markup.highlight]
    style = "github"

# 与语言无关的参数
[params]
  # 头像/图片，放在 static/ 下
  avatar = ""
  # 备案号（没有就留空）
  icp = ""

# ── 中文（默认，根路径）──────────────────────────────────────
[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-cn"
    contentDir = "content"
    title = "杨浩"
    weight = 1
    [languages.zh.params]
      description = "记录、笔记与一些小工具"
      # 首页名片区的标题和副标题
      tagline = "I build small tools. Mostly Python, mostly things I got tired of doing by hand."
    [[languages.zh.menu.main]]
      name = "博客"
      url = "/posts/"
      weight = 1
    [[languages.zh.menu.main]]
      name = "读书"
      url = "/reading/"
      weight = 2
    [[languages.zh.menu.main]]
      name = "笔记"
      url = "/notebook/"
      weight = 3
    [[languages.zh.menu.main]]
      name = "项目"
      url = "/projects/"
      weight = 4
    [[languages.zh.menu.main]]
      name = "关于"
      url = "/about/"
      weight = 5

  # ── 英文（/en/ 前缀）────────────────────────────────────────
  [languages.en]
    label = "English"
    locale = "en-us"
    contentDir = "content/en"
    title = "Hao Yang"
    weight = 2
    [languages.en.params]
      description = "Notes, experiments, and small tools"
      tagline = "I build small tools. Mostly Python, mostly things I got tired of doing by hand."
    [[languages.en.menu.main]]
      name = "Blog"
      url = "/posts/"
      weight = 1
    [[languages.en.menu.main]]
      name = "Reading"
      url = "/reading/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Notes"
      url = "/notebook/"
      weight = 3
    [[languages.en.menu.main]]
      name = "Projects"
      url = "/projects/"
      weight = 4
    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 5
