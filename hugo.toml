baseURL = "https://yanghaod2278827.github.io/"
defaultContentLanguage = "zh"
# 中文放根路径（/posts/...），英文放 /en/posts/...，已有的中文链接不会失效
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# 中文按「字」计入 WordCount/字数统计，否则整段中文只算 1 个词（阅读时间会算成 1 分钟）
hasCJKLanguage = true

# 文章 URL：/posts/2026/10/30/slug/
[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # 允许正文里写 HTML（README 风格的表格/图能直接粘）
  [markup.highlight]
    style = "github"

# 与语言无关的参数
[params]
  # 头像/图片，放在 static/ 下
  avatar = ""
  # 备案号（没有就留空）
  icp = ""

# ── 中文（默认，根路径）──────────────────────────────────────
[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-cn"
    contentDir = "content/zh"
    title = "杨浩"
    weight = 1
    [languages.zh.params]
      description = "记录、笔记与一些小工具"
      # 首页名片区的标题和副标题
      tagline = "I build small tools. Mostly Python, mostly things I got tired of doing by hand."
      # 首页 mono 区块（自我介绍，纯文本，换行原样保留）
      bio = """# 开源
主要在做两件事：
claude-statusline — Claude Code 跑第三方 API 时的成本状态栏
claude-worklog-dida — 从会话和文件时间戳还原每天做过的事
这个站也是开源的：Hugo + GitHub Actions，数字全部由脚本生成。"""
    [[languages.zh.menu.main]]
      name = "博客"
      url = "/posts/"
      weight = 1
    [[languages.zh.menu.main]]
      name = "动态"
      url = "/activity/"
      weight = 2
    [[languages.zh.menu.main]]
      name = "读书"
      url = "/reading/"
      weight = 6
    [[languages.zh.menu.main]]
      name = "笔记"
      url = "/notebook/"
      weight = 4
    [[languages.zh.menu.main]]
      name = "项目"
      url = "/projects/"
      weight = 3
    [[languages.zh.menu.main]]
      name = "观影"
      url = "/movies/"
      weight = 5
    [[languages.zh.menu.main]]
      name = "归档"
      url = "/archives/"
      weight = 7
    [[languages.zh.menu.main]]
      name = "关于"
      url = "/about/"
      weight = 8

  # ── 英文（/en/ 前缀）────────────────────────────────────────
  [languages.en]
    label = "English"
    locale = "en-us"
    contentDir = "content/en"
    title = "Hao Yang"
    weight = 2
    [languages.en.params]
      description = "Notes, experiments, and small tools"
      tagline = "I build small tools. Mostly Python, mostly things I got tired of doing by hand."
      bio = """# Open source
Two things, mostly:
claude-statusline — a cost-aware status line for Claude Code on third-party APIs
claude-worklog-dida — reconstructing a day's work from transcripts and file timestamps
This site is open source too: Hugo + GitHub Actions, every number script-generated."""
    [[languages.en.menu.main]]
      name = "Blog"
      url = "/posts/"
      weight = 1
    [[languages.en.menu.main]]
      name = "Activity"
      url = "/activity/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Reading"
      url = "/reading/"
      weight = 6
    [[languages.en.menu.main]]
      name = "Notes"
      url = "/notebook/"
      weight = 4
    [[languages.en.menu.main]]
      name = "Projects"
      url = "/projects/"
      weight = 3
    [[languages.en.menu.main]]
      name = "Movies"
      url = "/movies/"
      weight = 5
    [[languages.en.menu.main]]
      name = "Archive"
      url = "/archives/"
      weight = 7
    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 8

# ── 站内搜索索引（每语言一份 /index.json）────────────────────
[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

# ── 数学公式：让 $…$ / $$…$$ / \(…\) 原样进 HTML，交给 KaTeX 渲染 ──
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]
