theme = "PaperMod"
baseURL = "https://yanghaod2278827.github.io/"
defaultContentLanguage = "zh"
# 中文放根路径（/posts/...），英文放 /en/posts/...，已有的中文链接不会失效
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# 首页列表包含哪些 section。不写时 Hugo 会取「页面最多的那个」，
# 笔记一多就会把博客整个挤出首页（实测：加完 5 篇笔记后首页只剩笔记）
mainSections = ["posts", "notebook"]
# 中文按「字」计入 WordCount/字数统计，否则整段中文只算 1 个词（阅读时间会算成 1 分钟）
hasCJKLanguage = true

# 文章 URL：/posts/2026/10/30/slug/
[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # 允许正文里写 HTML（README 风格的表格/图能直接粘）
  [markup.highlight]
    style = "github"

# 与语言无关的参数
[params]
  # 头像/图片，放在 static/ 下
  avatar = ""
  # 备案号（没有就留空）
  icp = ""
  # ── PaperMod 试用参数 ──
  env = "production"
  ShowReadingTime = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowPostNavLinks = true

# ── 中文（默认，根路径）──────────────────────────────────────
[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-cn"
    contentDir = "content/zh"
    title = "杨浩"
    weight = 1
    [languages.zh.params]
      description = "记录、笔记与一些小工具"
      # 首页名片区的标题和副标题
      tagline = "I build small tools. Mostly Python, mostly things I got tired of doing by hand."
      homeInfoParams = { Title = "杨浩", Content = "记录、笔记与一些小工具。" }
      # 首页 about.txt 块（纯文本，换行原样保留）
      bio = """# 开源
主要在做两件事：
claude-statusline — Claude Code 跑第三方 API 时的成本状态栏
claude-worklog-dida — 从会话和文件时间戳还原每天做过的事
这个站也是开源的：Hugo + GitHub Actions，数字全部由脚本生成。"""
      # 首页社交按钮（PaperMod socialIcons）。注意 TOML 规则：数组表之后的键会归进数组元素，
      # 所以这一段必须放在 bio 之后、且后面不能再跟本表的其它键。
      [[languages.zh.params.socialIcons]]
        name = "github"
        url = "https://github.com/yanghaod2278827"
      [[languages.zh.params.socialIcons]]
        name = "bilibili"
        url = "https://space.bilibili.com/357798787"
      # 抖音：抖音号 d2278827；主页 URL 由分享短链 v.douyin.com/B7vVqFKo4l8 解析出的 sec_uid 拼成
      [[languages.zh.params.socialIcons]]
        name = "tiktok"
        title = "抖音"
        url = "https://www.douyin.com/user/MS4wLjABAAAA23-trcRF6O0CgMplB8ae7Ryt2utjgKi1xcubyDvLir0"
      [[languages.zh.params.socialIcons]]
        name = "email"
        url = "mailto:1936693568@qq.com"
      [[languages.zh.params.socialIcons]]
        name = "douban"
        url = "https://www.douban.com/people/d2278827/"
      [[languages.zh.params.socialIcons]]
        name = "orcid"
        url = "https://orcid.org/0009-0001-7869-3957"
      [[languages.zh.params.socialIcons]]
        name = "researchgate"
        url = "https://www.researchgate.net/profile/Hao-Yang-126"
      [[languages.zh.params.socialIcons]]
        name = "googlescholar"
        url = "https://scholar.google.com/citations?user=eClJNEMAAAAJ&hl=zh-CN"
      [[languages.zh.params.socialIcons]]
