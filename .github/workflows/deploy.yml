name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  # 每天 UTC 22:00 重新抓一次 GitHub 数据并重建（星星数会变）
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # 2026-11-18 改为 false：每天 22:00 的定时构建会把正在跑的 push 构建顶掉，
  # 导致「提交推上去了但看不到自己的部署记录」。改成排队执行，最后一次构建的
  # 一定是最新提交（GitHub 每组只保留一个排队位，更早的排队仍会被新任务替换）。
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Fetch data
        run: python3 scripts/fetch_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: yanghaod2278827

      - name: Build
        run: hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
